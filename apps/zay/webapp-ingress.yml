apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zay-webapp-ingress
  namespace: zayapp
spec:
  ingressClassName: nginx
  rules:
    - host: zay.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: zay-webapp-service
                port:
                  number: 80
