apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ayd-webapp-ingress
  namespace: aydapp
spec:
  ingressClassName: nginx
  rules:
    - host: ayd.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ayd-webapp-service
                port:
                  number: 80
