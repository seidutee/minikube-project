apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: teesapp
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/seidutee/minikube-project.git
    targetRevision: main
    path: apps/tees-app
  destination:
    server: https://kubernetes.default.svc
    namespace: teesapp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
